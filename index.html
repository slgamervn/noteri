<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOTERI</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F3EBDF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="favicon.svg" />
  <style>
    html, body { margin:0; padding:0; height:100%; background:#f3ebdf; color:#2a241c; font-family:system-ui,sans-serif; }
    #splash {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; background:#f3ebdf; z-index:9999;
    }
    #splash h1 { font-size:2.4rem; margin:0 0 12px; font-weight:700; }
    #splash p { margin:0; color:#7c6f60; font-size:1rem; }
    #root { min-height:100%; }
  </style>
</head>
<body>
  <div id="splash">
    <h1>NOTERI</h1>
    <p>Đang mở sổ tay…</p>
  </div>
  <div id="root"></div>
  <script>
    window.addEventListener("error", function(e) {
      document.getElementById("splash").innerHTML = "<h1>NOTERI</h1><p style='color:#b64038'>Lỗi tải. Thử tải lại trang.</p>";
    });
    const obs = new MutationObserver(function() {
      var root = document.getElementById("root");
      if (root && root.children.length) {
        var s = document.getElementById("splash");
        if (s) s.style.display = "none";
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
  <script type="module" src="./assets/index-DRaFqZ6T.js"></script>
</body>
</html>
