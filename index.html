<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOTERI</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F3EBDF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="favicon.svg" />
  <style>
    :root { --bg:#f3ebdf; --surface:#fff9f2; --ink:#2a241c; --accent:#c4512c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); z-index:999; }
    #splash h1 { font-size:2.2rem; margin:0 0 8px; }
    #splash p { color:#7c6f60; margin:0; }
    #root { min-height:100vh; }
  </style>
</head>
<body>
  <div id="splash">
    <h1>NOTERI</h1>
    <p>Đang mở sổ tay…</p>
  </div>
  <div id="root"></div>
  <script>
    // Hide splash as soon as React mounts
    const obs = new MutationObserver(() => {
      if (document.getElementById("root").children.length) {
        document.getElementById("splash").style.display = "none";
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById("root"), { childList: true });
  </script>
  <script type="module" src="./assets/index-CfxRli_m.js"></script>
</body>
</html>
