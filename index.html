<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOTERI</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#F3EBDF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="favicon.svg" />
  <style>
    html, body { margin:0; padding:0; min-height:100%; background:#f3ebdf; color:#2a241c; font-family:system-ui,-apple-system,sans-serif; }
    #fallback { padding:24px; max-width:640px; margin:0 auto; }
    #fallback h1 { font-size:2rem; margin:0 0 8px; }
    #fallback .card { background:#fff9f2; border-radius:16px; padding:16px; margin:12px 0; }
    #root { min-height:100vh; }
    #root:empty + #fallback, #root:not(:empty) ~ #fallback { display:none; }
    #root:not(:empty) { display:block; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="fallback">
    <h1>NOTERI</h1>
    <p id="status">Đang tải sổ tay…</p>
    <div class="card">
      <p>Nếu thấy dòng này lâu, nhấn nút bên dưới.</p>
      <button onclick="location.reload()" style="background:#c4512c;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:600;">Tải lại</button>
    </div>
  </div>
  <script type="module">
    const status = document.getElementById("status");
    try {
      await import("./assets/index-DRaFqZ6T.js");
      // Wait a bit to see if React actually renders something
      setTimeout(() => {
        const root = document.getElementById("root");
        if (!root || root.children.length === 0) {
          status.textContent = "App chưa hiện. Thử tải lại.";
          status.style.color = "#b64038";
        }
      }, 3000);
    } catch (err) {
      status.textContent = "Lỗi tải: " + (err && err.message ? err.message : String(err));
      status.style.color = "#b64038";
    }
  </script>
</body>
</html>
